<!DOCTYPE html>
<html lang="fr">
 <meta charset="utf-8"/>
 <meta content="width=device-width,initial-scale=1" name="viewport"/>
 <title>
  Icônes / fond sombre
 </title>
 <link href="../../assets/css/icons.css" rel="stylesheet"/>
 <style>
  body{background:#0a202b;color:#e5f0f4;font:16px Arial;padding:30px}main{max-width:950px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:25px}.item{padding:15px 0;border-bottom:1px solid #44616e}.item span.label{display:block;margin-top:15px;font-size:13px}h2{margin-top:35px}.anssi-logo{display:block}.light{background:#eff5f7;color:#183141;padding:20px}
 </style>
 <main>
  <h1>
   Icônes sur fond sombre
  </h1>
  <div class="grid">
   <div class="item">
    <span aria-label="image" class="portfolio-icon portfolio-icon--image" role="img">
    </span>
    <span class="label">
     image / masque CSS
    </span>
   </div>
   <div class="item">
    <span aria-label="android" class="portfolio-icon portfolio-icon--android" role="img">
    </span>
    <span class="label">
     android / masque CSS
    </span>
   </div>
   <div class="item">
    <span aria-label="web" class="portfolio-icon portfolio-icon--web" role="img">
    </span>
    <span class="label">
     web / masque CSS
    </span>
   </div>
   <div class="item">
    <span aria-label="shield" class="portfolio-icon portfolio-icon--shield" role="img">
    </span>
    <span class="label">
     shield / masque CSS
    </span>
   </div>
   <div class="item">
    <img alt="linkedin-light" class="portfolio-icon-img" height="50" src="../../assets/icons/linkedin-light.png" width="50"/>
    <span class="label">
     linkedin-light / PNG original
    </span>
   </div>
   <div class="item">
    <img alt="instagram-light" class="portfolio-icon-img" height="50" src="../../assets/icons/instagram-light.png" width="50"/>
    <span class="label">
     instagram-light / PNG original
    </span>
   </div>
   <div class="item">
    <img alt="flag-fr" class="portfolio-icon-img" height="48" src="../../assets/icons/flag-fr.png" width="48"/>
    <span class="label">
     flag-fr / PNG original
    </span>
   </div>
   <div class="item">
    <img alt="flag-en" class="portfolio-icon-img" height="48" src="../../assets/icons/flag-en.png" width="48"/>
    <span class="label">
     flag-en / PNG original
    </span>
   </div>
  </div>
  <h2>
   ANSSI / original conservé
  </h2>
  <img alt="ANSSI" class="anssi-logo" height="1000" src="../../assets/logos/anssi.png" width="1000"/>
  <p>
   Les zones blanches intérieures appartiennent au logo.
  </p>
 </main>
</html>
