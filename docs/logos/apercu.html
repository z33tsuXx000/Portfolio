<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logos / aperçu d'intégration</title><link rel="stylesheet" href="logos.css"><style>body{margin:0;background:#0a202b;color:#e4f0f5;font:16px system-ui;padding:28px}main{max-width:1000px;margin:auto}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px;margin:24px 0}figure{margin:0}figure>div{height:150px;display:flex;align-items:center;padding:15px;border:1px solid #547280}figure img{max-width:100%;max-height:130px;object-fit:contain}.light{background:#edf3f6}figcaption{padding:10px 0;font-size:13px}.row{display:flex;gap:24px;align-items:center;min-height:90px;border-bottom:1px solid #547280}.note{font-size:13px;color:#b7cbd6}</style><main><h1>Logos du portfolio</h1><p class="note">Comparer sur fond sombre et clair. Les couleurs d'origine ne sont pas toutes conçues pour le sombre.</p><section id="dark"></section><section id="light"></section><h2>Tailles d'intégration</h2><div id="rows"></div><h2>Option monochrome pour ESAIP</h2><span class="organization-logo--mono" role="img" aria-label="ESAIP, traitement monochrome" style="--logo-url:url('../../assets/img/logos/esaip.png')"></span><p class="note">Traitement graphique par masque, pas une variante officielle du logo.</p></main><script>const logos=[['esaip.png','ESAIP'],['han.png','HAN University'],['happy-babees.png','Happy Babees'],['esaip-robotics.png','ESAIP Robotics'],['wilaya-emblem.png','Préfecture d’Agadir Ida-Outanane']];for(const id of ['dark','light'])document.getElementById(id).innerHTML=logos.map(([f,n])=>`<figure><div class="${id==='light'?'light':''}"><img src="../../assets/img/logos/${f}" alt="${n}"></div><figcaption>${n}</figcaption></figure>`).join('');document.getElementById('rows').innerHTML=logos.map(([f,n])=>`<div class="row"><img class="organization-logo ${f==='wilaya-emblem.png'?'organization-logo--emblem':''}" src="../../assets/img/logos/${f}" alt=""><span>${n}</span></div>`).join('');</script></html>
